<div class="modal-header">
  <h5 class="modal-title mr-auto">Editar Cita</h5>
  <button type="button" class="close" aria-label="Close" (click)="onNoClick()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <form [formGroup]="editCitaForm" (ngSubmit)="onSave()">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="fecha">Fecha</label>
        <mat-form-field class="w-100">
          <input matInput [matDatepicker]="picker" formControlName="fecha" id="fecha">
          <mat-datepicker-toggle matSuffix [for]="picker">
            <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <div *ngIf="editCitaForm.get('fecha')?.invalid && (editCitaForm.get('fecha')?.dirty || editCitaForm.get('fecha')?.touched)">
          <small class="text-danger">La fecha es requerida o no hay programación disponible.</small>
        </div>
      </div>
      <div class="form-group col-md-6">
        <label for="hora">Hora</label>
        <select class="form-control" id="hora" formControlName="hora" [disabled]="editCitaForm.get('hora')?.disabled ?? true">
          <option *ngFor="let hora of horasDisponibles" [ngValue]="hora">
            {{ hora }}
          </option>
        </select>
        <div *ngIf="editCitaForm.get('hora')?.invalid && (editCitaForm.get('hora')?.dirty || editCitaForm.get('hora')?.touched)">
          <small class="text-danger">La hora es requerida.</small>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-12 text-right">
        <button type="button" class="btn btn-secondary mr-2" (click)="onNoClick()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="editCitaForm.invalid">Guardar</button>
      </div>
    </div>
  </form>
</div>
